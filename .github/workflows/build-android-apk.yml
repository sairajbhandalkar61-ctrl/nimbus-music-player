name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Live Render backend HTTPS URL (e.g. https://nimbus-music-player.onrender.com)'
        required: true
        default: 'https://nimbus-music-player.onrender.com'
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite assets & sync Capacitor Android
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npm run android:sync

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package Nimbus-debug.apk
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk Nimbus-debug.apk

      - name: Upload Nimbus-Android-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nimbus-Android-APK
          path: Nimbus-debug.apk
          if-no-files-found: error
